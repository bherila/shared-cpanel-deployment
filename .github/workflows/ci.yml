name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  real-laravel:
    strategy:
      fail-fast: false
      matrix:
        laravel: ['^12.0', '^13.0']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Real Laravel ${{ matrix.laravel }} maintenance probe
        run: bash scripts/test-real-laravel-atomic.sh '${{ matrix.laravel }}'

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: install-cron.sh harness
        run: bash scripts/test-install-cron.sh

      - name: prepare-cron-lines.sh harness
        run: bash scripts/test-prepare-cron-lines.sh

      - name: atomic-release.sh harness
        run: bash scripts/test-atomic-release.sh

      - name: rsync-atomic-release.sh harness
        run: bash scripts/test-rsync-atomic-release.sh

      - name: composite action phase contract
        run: bash scripts/test-action-contract.sh

      - name: remote process-substitution portability fixtures
        run: bash scripts/test-no-process-substitution.sh

      - name: composite live verification and healthy preservation harness
        run: python3 scripts/test-live-verification.py

      - name: read-only application preflight hook harness
        run: bash scripts/test-run-preflight-hook.sh

      - name: rsync-deploy.sh harness
        run: bash scripts/test-rsync-deploy.sh

      - name: rsync-migrations.sh harness
        run: bash scripts/test-rsync-migrations.sh

      - name: htaccess.sh harness
        run: bash scripts/test-htaccess.sh

      - name: verify-web-php.sh harness
        run: bash scripts/test-verify-web-php.sh

      - name: configure-env.sh harness
        run: bash scripts/test-configure-env.sh

      - name: assert-no-pending-migrations.sh harness
        run: bash scripts/test-assert-no-pending-migrations.sh

      - name: remote-artisan.sh harness
        run: bash scripts/test-remote-artisan.sh

      - name: operational-audit.sh harness
        run: bash scripts/test-operational-audit.sh

      - name: canonical runtime audit harness
        run: bash scripts/test-runtime-audit.sh

      - name: read-only post-finalizer hook harness
        run: bash scripts/test-run-post-finalize-hook.sh

      - name: ensure-passport-keys.sh harness
        run: bash scripts/test-ensure-passport-keys.sh

      - name: install-branding.sh harness
        run: bash scripts/test-install-branding.sh

      - name: Install OpenSSH server
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            for attempt in 1 2 3; do
              if sudo apt-get update -q \
                && sudo apt-get install -y -q --no-install-recommends openssh-server; then
                break
              fi
              [ "$attempt" = 3 ] && exit 1
              sleep $((attempt * 10))
            done
          fi

      - name: configure-ssh.sh real-transport harness
        run: bash scripts/test-configure-ssh.sh

      - name: action.yml references only scripts that exist
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r script; do
            [ -f "$script" ] || { echo "::error file=action.yml::$script does not exist"; status=1; }
          done < <(grep -o 'scripts/[A-Za-z0-9._-]*\.sh' action.yml | sort -u)
          exit "$status"

      - name: action.yml is valid YAML
        run: ruby -ryaml -e 'YAML.load_file("action.yml")'
